version: '3.8'

services:
  # PHP backend (Laravel)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dform-backend
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - dform_net
    depends_on:
      - db

  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: dform-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/var/www/data-storage-oprec
    networks:
      - dform_net
    depends_on:
      - backend

  # MariaDB database
  db:
    image: mariadb:10.11
    container_name: dform-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: d_form_api
      MYSQL_USER: dform
      MYSQL_PASSWORD: dform_local
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dform_net

volumes:
  db_data:

networks:
  dform_net:
    driver: bridge
